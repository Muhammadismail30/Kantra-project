version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: kantra_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: kantra_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./server
    container_name: kantra_backend
    restart: on-failure
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db 
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=kantra_db
      - JWT_SECRET=rahasia_super_kantra_2026
    depends_on:
      - db
   
    command: sh -c "sleep 10 && npm start"

  frontend:
    build: ./client
    container_name: kantra_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend

volumes:
  db_data: